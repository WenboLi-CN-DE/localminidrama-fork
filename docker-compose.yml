services:
  localminidrama:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: localminidrama
    restart: unless-stopped
    ports:
      # WSL mirrored networking exposes this to Windows localhost. Windows then
      # forwards LAN traffic from 192.168.50.218:5679 to 127.0.0.1:5680.
      - "5680:5679"
    volumes:
      - ./backend-node/data:/app/backend-node/data
      - ./backend-node/configs/config.yaml:/app/backend-node/configs/config.yaml:ro
